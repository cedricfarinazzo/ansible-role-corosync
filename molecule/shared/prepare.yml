---
# Shared by every scenario: tools for the checks, and packages start their services on install, as on a host.
- name: Prepare
  hosts: all
  tasks:
    # The image's policy-rc.d (exit 101) stops every postinst from starting its service; a real host starts
    # corosync at once on the package's default configuration: removed, so the scenarios install as a host does
    - name: Packages start their services on install, as on a host
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

    - name: Tools are installed
      ansible.builtin.apt:
        name:
          - iproute2
          - procps
        update_cache: true
        cache_valid_time: 3600

- name: The qnetd server
  hosts: qnetd
  tasks:
    - name: Corosync-qnetd is installed and running
      ansible.builtin.apt:
        name: corosync-qnetd
        state: present

    - name: Corosync-qnetd runs
      ansible.builtin.systemd_service:
        name: corosync-qnetd.service
        state: started
        enabled: true
