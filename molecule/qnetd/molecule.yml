---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/collections.yml"'
driver:
  name: docker
# The qnetd server alone: install, options, restart on new options, a stale cache, absent, a server set up beforehand
platforms:
  - name: qnetd-server-${MOLECULE_DISTRO:-debian13}
    hostname: qnetd
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - qnetd
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      qnetd:
        corosync_mode: qnetd
verifier:
  name: ansible
scenario:
  name: qnetd
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
