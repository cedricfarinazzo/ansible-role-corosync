---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/collections.yml"'
driver:
  name: docker
# Two nodes on one network: failure paths on a built cluster
platforms:
  - name: corosync-a-${MOLECULE_DISTRO:-debian13}
    hostname: corosync-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: corosync-failure-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: corosync-b-${MOLECULE_DISTRO:-debian13}
    hostname: corosync-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: corosync-failure-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      nodes:
        molecule_nodeid: "{{ groups['nodes'].index(inventory_hostname) + 1 }}"
        corosync_cluster_name: molecule
        corosync_two_node: true
        molecule_all: "{{ groups['nodes'] | map('extract', hostvars) | map(attribute='molecule_node') | list }}"
        # molecule_mismatch: the first host sees another nodeid for the second node
        corosync_nodes: >-
          {{ molecule_all[:1] + [molecule_all[1] | combine({'nodeid': 7})]
             if molecule_mismatch | default(false) | bool and inventory_hostname == groups['nodes'][0]
             else molecule_all }}
        molecule_node:
          name: "{{ inventory_hostname.split('-')[:2] | join('-') }}"
          host: "{{ inventory_hostname }}"
          nodeid: "{{ molecule_nodeid | int }}"
          addrs:
            - "{{ ansible_facts.default_ipv4.address }}"
verifier:
  name: ansible
scenario:
  name: failure
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - destroy
