---
dependency:
  name: shell
  command: sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/collections.yml"'
driver:
  name: docker
# Two nodes and a qnetd host: ffsplit, the qdevice is the third vote
platforms:
  - name: corosync-a-${MOLECULE_DISTRO:-debian13}
    hostname: corosync-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: corosync-qdevice-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: corosync-b-${MOLECULE_DISTRO:-debian13}
    hostname: corosync-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: corosync-qdevice-${MOLECULE_DISTRO:-debian13}
    groups:
      - nodes
  - name: qnetd-${MOLECULE_DISTRO:-debian13}
    hostname: qnetd
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: corosync-qdevice-${MOLECULE_DISTRO:-debian13}
    groups:
      - qnetd
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
      # The qnetd server from the role itself: no other role, no prepare step
      qnetd:
        corosync_mode: qnetd
      nodes:
        molecule_nodeid: "{{ groups['nodes'].index(inventory_hostname) + 1 }}"
        corosync_cluster_name: molecule
        corosync_qdevice: true
        # Its container name: Docker's DNS resolves it on the scenario's network
        corosync_qdevice_host: "{{ groups['qnetd'] | first }}"
        corosync_qdevice_algorithm: ffsplit
        corosync_nodes: >-
          {{ groups['nodes'] | map('extract', hostvars) | map(attribute='molecule_node') | list }}
        molecule_node:
          name: "{{ inventory_hostname.split('-')[:2] | join('-') }}"
          host: "{{ inventory_hostname }}"
          nodeid: "{{ molecule_nodeid | int }}"
          addrs:
            - "{{ ansible_facts.default_ipv4.address }}"
verifier:
  name: ansible
scenario:
  name: qdevice
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
